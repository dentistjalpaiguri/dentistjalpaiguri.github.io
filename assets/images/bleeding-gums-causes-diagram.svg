<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Arial, sans-serif">
  <rect width="900" height="500" fill="#ffffff"/>
  <text x="450" y="40" text-anchor="middle" font-size="26" font-weight="700" fill="#0056b3">Why Do Gums Bleed When Brushing?</text>

  <!-- Local causes column -->
  <rect x="40" y="75" width="380" height="34" rx="6" fill="#0056b3"/>
  <text x="230" y="98" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">Local / Dental Causes</text>

  <g font-size="14.5" fill="#1a1a1a">
    <rect x="40" y="120" width="380" height="52" rx="6" fill="#f0f7ff" stroke="#cfe3fb"/>
    <text x="58" y="141">Gingivitis (plaque buildup)</text>
    <text x="58" y="160" fill="#555">Most common cause — reversible</text>

    <rect x="40" y="182" width="380" height="52" rx="6" fill="#f0f7ff" stroke="#cfe3fb"/>
    <text x="58" y="203">Tartar (calculus)</text>
    <text x="58" y="222" fill="#555">Needs professional cleaning</text>

    <rect x="40" y="244" width="380" height="52" rx="6" fill="#f0f7ff" stroke="#cfe3fb"/>
    <text x="58" y="265">Brushing too hard</text>
    <text x="58" y="284" fill="#555">Use soft-bristled brush, gentle pressure</text>

    <rect x="40" y="306" width="380" height="52" rx="6" fill="#f0f7ff" stroke="#cfe3fb"/>
    <text x="58" y="327">New flossing routine</text>
    <text x="58" y="346" fill="#555">Mild bleeding in week one is normal</text>
  </g>

  <!-- Systemic causes column -->
  <rect x="480" y="75" width="380" height="34" rx="6" fill="#d63031"/>
  <text x="670" y="98" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">Systemic Factors to Know</text>

  <g font-size="14.5" fill="#1a1a1a">
    <rect x="480" y="120" width="380" height="52" rx="6" fill="#fff2f2" stroke="#f5c6c6"/>
    <text x="498" y="141">Diabetes</text>
    <text x="498" y="160" fill="#555">Increases periodontal disease risk</text>

    <rect x="480" y="182" width="380" height="52" rx="6" fill="#fff2f2" stroke="#f5c6c6"/>
    <text x="498" y="203">Blood-thinning medicines</text>
    <text x="498" y="222" fill="#555">Anticoagulant / antiplatelet drugs</text>

    <rect x="480" y="244" width="380" height="52" rx="6" fill="#fff2f2" stroke="#f5c6c6"/>
    <text x="498" y="265">Low platelet count</text>
    <text x="498" y="284" fill="#555">Thrombocytopenia — many possible causes</text>

    <rect x="480" y="306" width="380" height="52" rx="6" fill="#fff2f2" stroke="#f5c6c6"/>
    <text x="498" y="327">Vitamin C deficiency</text>
    <text x="498" y="346" fill="#555">Uncommon; consider with other symptoms</text>
  </g>

  <!-- When to see dentist bar -->
  <rect x="40" y="390" width="820" height="80" rx="8" fill="#0056b3"/>
  <text x="450" y="420" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">See a dentist if bleeding continues past 10–14 days,</text>
  <text x="450" y="444" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">or with swelling, recession, bad breath, or loose teeth</text>

  <text x="450" y="490" text-anchor="middle" font-size="12" fill="#888">Dr. S. Roy's SMILE Dental Clinic, Jalpaiguri — educational diagram, not a diagnosis</text>
</svg>
