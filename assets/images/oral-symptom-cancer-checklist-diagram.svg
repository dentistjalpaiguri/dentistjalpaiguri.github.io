<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Arial, sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>
  <text x="450" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#0056b3">Mouth Ulcer, Gum Swelling or Bleeding —</text>
  <text x="450" y="68" text-anchor="middle" font-size="24" font-weight="700" fill="#0056b3">When Should You Get It Checked?</text>

  <!-- Usually fine column -->
  <rect x="40" y="100" width="380" height="34" rx="6" fill="#2e7d32"/>
  <text x="230" y="123" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Usually Not a Concern</text>

  <g font-size="14" fill="#1a1a1a">
    <rect x="40" y="145" width="380" height="46" rx="6" fill="#f1f8f1" stroke="#c8e6c9"/>
    <text x="58" y="173">Ulcer heals within 7–14 days</text>

    <rect x="40" y="200" width="380" height="46" rx="6" fill="#f1f8f1" stroke="#c8e6c9"/>
    <text x="58" y="228">Gum swelling with soreness, improves with cleaning</text>

    <rect x="40" y="255" width="380" height="46" rx="6" fill="#f1f8f1" stroke="#c8e6c9"/>
    <text x="58" y="283">Bleeding tied to brushing habit or new flossing</text>

    <rect x="40" y="310" width="380" height="46" rx="6" fill="#f1f8f1" stroke="#c8e6c9"/>
    <text x="58" y="338">No lumps, no numbness, no voice change</text>
  </g>

  <!-- Get checked column -->
  <rect x="480" y="100" width="380" height="34" rx="6" fill="#c62828"/>
  <text x="670" y="123" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Arrange an Examination</text>

  <g font-size="14" fill="#1a1a1a">
    <rect x="480" y="145" width="380" height="46" rx="6" fill="#fdecea" stroke="#f5b8b3"/>
    <text x="498" y="173">Ulcer lasting more than 3 weeks</text>

    <rect x="480" y="200" width="380" height="46" rx="6" fill="#fdecea" stroke="#f5b8b3"/>
    <text x="498" y="228">Persistent lump, red or white patch</text>

    <rect x="480" y="255" width="380" height="46" rx="6" fill="#fdecea" stroke="#f5b8b3"/>
    <text x="498" y="283">Painless sore that won't heal</text>

    <rect x="480" y="310" width="380" height="46" rx="6" fill="#fdecea" stroke="#f5b8b3"/>
    <text x="498" y="338">Numbness, voice change, difficulty swallowing</text>
  </g>

  <!-- key message -->
  <rect x="40" y="380" width="820" height="110" rx="8" fill="#0056b3"/>
  <text x="450" y="412" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">These symptoms do NOT automatically mean cancer.</text>
  <text x="450" y="438" text-anchor="middle" font-size="14.5" fill="#e8f0fb">A normal platelet count does not rule out oral cancer, and a low</text>
  <text x="450" y="460" text-anchor="middle" font-size="14.5" fill="#e8f0fb">platelet count does not mean cancer. Examination — not guessing —</text>
  <text x="450" y="478" text-anchor="middle" font-size="14.5" fill="#e8f0fb">is the right first step. Biopsy is the only definitive test.</text>

  <text x="450" y="520" text-anchor="middle" font-size="12" fill="#888">Dr. S. Roy's SMILE Dental Clinic, Jalpaiguri — educational diagram, not a diagnosis</text>
</svg>
